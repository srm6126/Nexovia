<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0755d9"><meta name="description" content="SHAHIN APP - Smart Business Solution">
<link rel="manifest" href="./manifest.webmanifest">
<title>SHAHIN APP | SMART BUSINESS SOLUTION</title>
<style>
:root{--blue:#0755d9;--navy:#082d91;--green:#13ad39;--bg:#eef5ff;--card:#fff;--text:#12285c;--muted:#71809d;--line:#d6e4fb;--danger:#d92d20}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eaf3ff,#f8fbff 60%,#eaf3ff);font-family:system-ui,"Noto Sans Bengali",sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:900px;margin:auto;padding:0 12px 100px}
header{position:sticky;top:0;z-index:10;margin:0 -12px 14px;padding:11px 15px;display:flex;align-items:center;gap:10px;color:white;background:linear-gradient(110deg,#0874ff,#0635b8);border-bottom:4px solid #54df43;border-radius:0 0 20px 20px;box-shadow:0 4px 14px #164eaa33}
.brand{flex:1;display:flex;flex-direction:column;line-height:1.15}.brand b{font-size:20px}.brand small{font-size:10px;font-style:italic}.headbtn{border:0;border-left:1px solid #ffffff55;background:transparent;color:white;padding:7px 9px;font-size:20px}
.welcome{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 14px;gap:8px}.welcome h1{margin:2px 0;font-size:21px}.welcome small{color:#2772d4;font-weight:800}.date{font-size:11px;background:white;border:1px solid var(--line);padding:7px 9px;border-radius:20px;white-space:nowrap}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:19px}.metric{--c:#0879ed;--bgc:#e4f2ff;position:relative;text-align:left;min-height:82px;border:1px solid var(--c);border-left:5px solid var(--c);border-radius:15px;background:linear-gradient(120deg,#fff,var(--bgc));padding:9px 6px 8px 45px;box-shadow:0 3px 8px #183e7a18;color:#142f80}.metric i{position:absolute;left:8px;top:23px;font-style:normal;font-size:23px}.metric span{display:block;font-size:11px;font-weight:750;line-height:1.35}.metric b{display:block;font-size:18px;color:var(--c);margin-top:3px;white-space:nowrap}
.green{--c:#13ad39;--bgc:#e6ffeb}.orange{--c:#f47720;--bgc:#fff0e5}.purple{--c:#8c2be7;--bgc:#f4eaff}.cyan{--c:#04a9c5;--bgc:#e2fbff}
.heading{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(100deg,#0754d7,#1185ff);padding:7px 11px;border-radius:13px;color:white;margin:0 0 10px}.heading b{font-size:14px}.heading button{border:1px solid white;border-radius:20px;background:white;color:#0645bf;font-size:11px;font-weight:800;padding:5px 10px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.q{min-height:72px;border:1px solid var(--c);border-radius:14px;background:linear-gradient(145deg,#fff,var(--bgc));box-shadow:0 3px 7px #163c7518;color:#092d91;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.q i{font-size:24px;font-style:normal}.q b{font-size:11px}
.summary{margin:18px 0 12px;padding:9px 7px;background:white;border:1px solid #bfd8ff;border-radius:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:center;font-size:10px}.summary>div{border-left:1px solid #b3cafa;padding-left:7px}.summary small,.summary strong{display:block}.summary strong{font-size:11px;color:#0752c2}
.panel{background:var(--card);border:1px solid #cbdfff;border-radius:17px;padding:14px;margin-top:12px;box-shadow:0 4px 12px #1b3d7415}.panel h2{margin:4px 0 12px;font-size:20px}.muted{color:var(--muted);font-size:12px}.hidden{display:none!important}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--blue);color:#fff;font-weight:700;font-size:13px}.btn.secondary{background:#eaf2ff;color:#0754c8}.btn.danger{background:#fff0ef;color:#b42318}.btn.success{background:#e7f9ec;color:#087b2b}.btn.small{padding:6px 9px;font-size:11px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}.field label{font-size:12px;font-weight:700;color:#29477f}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd8ee;border-radius:9px;padding:10px;background:#fff;color:#132b5a;min-width:0}.field textarea{min-height:72px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:12px;min-width:560px}th,td{padding:9px 8px;border-bottom:1px solid #e6eefb;text-align:left;white-space:nowrap}th{background:#f0f6ff;color:#23447e}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#f4f8ff;border:1px solid var(--line);border-radius:11px;padding:10px}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{font-size:16px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(900px,100%);padding:7px 5px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(110deg,#0878ed,#0635b9);border:2px solid #28c9e8;border-radius:22px 22px 0 0;z-index:20}
nav button{border:0;border-right:1px solid #ffffff55;background:transparent;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;font-size:21px}nav button b{font-size:10px}nav button.active{background:#ffffff20;border-radius:12px}
.login{max-width:420px;margin:10vh auto;padding:22px}.login h1{color:var(--blue)}.notice{padding:10px;border-radius:10px;background:#fff8e6;color:#805b00;font-size:12px;line-height:1.5;margin:10px 0}.ok{background:#e9f9ee;color:#087b2b}.dangertext{color:var(--danger)}
@media(max-width:390px){.app{padding-left:8px;padding-right:8px}.grid{gap:5px}.q{min-height:67px}.q b{font-size:10px}.metric{padding-left:40px}.metric span{font-size:10px}.metric b{font-size:16px}.formgrid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.summary>b{grid-column:1/-1}}
</style></head>
<body><div id="root"></div>
<script>
(()=>{
const $=s=>document.querySelector(s), money=n=>'৳ '+(Number(n||0)).toLocaleString('bn-BD',{maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10);
const STORE='shahin_app_v2_data', SESSION='shahin_app_v2_session';
const defaults={settings:{appName:'SHAHIN APP',tagline:'SMART BUSINESS SOLUTION',company:'আবরার ট্রেডিং কর্পোরেশন',currency:'৳',target:1000000,theme:'#0755d9',units:['পাতা','পিস','কার্টুন','কেজি','লিটার','মিলি','গ্রাম'],apiUrl:'',apiKey:'',workerApiUrl:'',scannerProvider:'gemini',scannerApiUrl:'',scannerApiKey:'',scannerModel:'gemini-2.5-flash',supportProvider:'openai',supportApiUrl:'',supportApiKey:'',supportModel:'gpt-4o-mini',notificationApiUrl:'',businessStart:'2026-11-01'},users:[{id:'u-admin',name:'প্রধান প্রশাসক',role:'admin',pin:'612600',active:true}],products:[],dsrs:[],sales:[],receipts:[],expenses:[],companyReceipts:[],stockMoves:[],tickets:[],audit:[],openingBalances:[],talikhata:{name:'আবরার টালি খাতা',rules:'প্রতিটি লেনদেন তারিখ ও রেফারেন্সসহ সংরক্ষণ করুন।'},categories:['দুধ','দই','বাটার','অন্যান্য']};
let db=load(), user=null, page='home';
function load(){try{const raw=JSON.parse(localStorage.getItem(STORE)||'{}');return {...structuredClone(defaults),...raw,settings:{...defaults.settings,...(raw.settings||{})}}}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(STORE,JSON.stringify(db))}
function log(action,detail){db.audit.unshift({id:crypto.randomUUID(),at:new Date().toISOString(),by:user?.name||'সিস্টেম',action,detail});save()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function field(label,name,type='text',value='',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function select(label,name,opts,value=''){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function shell(content){let s=db.settings;$('#root').innerHTML=`<div class="app"><header><div style="font-size:29px">▥</div><div class="brand"><b>${esc(s.appName)}</b><small>${esc(s.tagline)}</small></div><button class="headbtn" data-go="support">🎧</button><button class="headbtn" data-go="notifications">🔔</button></header>${content}</div>${nav()}`;bind()}
function nav(){return `<nav>${[['home','⌂','হোম'],['support','🎧','সাপোর্ট'],['dsr','👥','DSR'],['reports','▤','রিপোর্ট'],['settings','⚙','সেটিং']].map(([k,i,t])=>`<button class="${page===k?'active':''}" data-go="${k}">${i}<b>${t}</b></button>`).join('')}</nav>`}
function bind(){$$(' [data-go]'.trim()).forEach(b=>b.onclick=()=>go(b.dataset.go));$$('[data-action]').forEach(b=>b.onclick=()=>actions(b.dataset.action,b.dataset.id));$$('form[data-form]').forEach(f=>f.onsubmit=e=>{e.preventDefault();forms(f.dataset.form,new FormData(f))})}
function $$(s){return [...document.querySelectorAll(s)]}
function go(k){if(k==='settings'&&user?.role!=='admin'){alert('অনুমতি নেই। Settings শুধু Admin দেখতে পারবেন।');return}page=k;render()}
function render(){if(!user){login();return}if(page==='home')home();else if(page==='settings')settings();else if(page==='accounts')accounts();else if(page==='products')products();else if(page==='receive')receive();else if(page==='dsr')dsrPage();else if(page==='sales')salesPage();else if(page==='expenses')expensesPage();else if(page==='stock')stockPage();else if(page==='reports')reports();else if(page==='support')support();else if(page==='talikhata')talikhata();else if(page==='notifications')notifications();else generic(page)}
function login(){ $('#root').innerHTML=`<div class="panel login"><h1>▥ SHAHIN APP</h1><b>${esc(db.settings.company)}</b><p class="muted">নিরাপদ প্রবেশ — আপনার অ্যাকাউন্টের PIN দিন</p><form data-form="login">${field('PIN নম্বর','pin','password','','inputmode="numeric" autocomplete="current-password"')}<button class="btn" style="width:100%">লগইন</button></form><div class="notice">প্রাথমিক সেটআপ: প্রথমবার Admin PIN 612600। প্রবেশের পর Settings থেকে PIN পরিবর্তন করুন। এই Local Preview-এর PIN ব্রাউজারের ডেটায় থাকে; লাইভ ব্যবহারের আগে Supabase Auth/RLS সেটআপ আবশ্যক।</div></div>`;bind()}
function home(){let total=db.sales.reduce((a,x)=>a+x.total,0),paid=db.receipts.reduce((a,x)=>a+x.amount,0),due=db.sales.reduce((a,x)=>a+x.due,0),stock=db.stockMoves.reduce((a,x)=>a+(x.qty*x.cost*x.sign),0),profit=db.sales.reduce((a,x)=>a+x.profit,0);let month=today().slice(0,7);let ms=db.sales.filter(x=>x.date.startsWith(month)).reduce((a,x)=>a+x.total,0);
shell(`<section class="welcome"><div><small>${esc(db.settings.company)}</small><h1>স্বাগতম, ${esc(user.name)}</h1><p class="muted">${esc(roleBn(user.role))} প্যানেল</p></div><span class="date">${new Date().toLocaleDateString('bn-BD')}</span></section>
<section class="metrics"><button class="metric" data-go="sales"><i>🛒</i><span>এই মাসের বিক্রি</span><b>${money(ms)}</b></button><button class="metric green" data-go="sales"><i>💰</i><span>মোট জমা</span><b>${money(paid)}</b></button><button class="metric orange" data-go="sales"><i>◷</i><span>মোট বকেয়া</span><b>${money(due)}</b></button><button class="metric purple" data-go="stock"><i>📦</i><span>স্টক মূল্য (নেট)</span><b>${money(stock)}</b></button><button class="metric cyan" data-go="reports"><i>▦</i><span>কোম্পানি বকেয়া</span><b>${money(db.companyReceipts.reduce((a,x)=>a+x.due,0))}</b></button><button class="metric green" data-go="reports"><i>↗</i><span>নথিভুক্ত লাভ</span><b>${money(profit)}</b></button></section>
<div class="heading"><b>⚡ দ্রুত কাজ</b><button data-go="all">সব দেখুন →</button></div><div class="grid">${[['dsr','👥','DSR'],['receive','📦','মাল গ্রহণ'],['products','🧊','প্রোডাক্ট'],['stock','🧱','স্টক'],['expenses','👛','খরচ'],['accounts','👤','একাউন্ট'],['settings','⚙️','সেটিং'],['talikhata','📒','টালি খাতা']].map(([k,i,t])=>`<button class="q" data-go="${k}"><i>${i}</i><b>${t}</b></button>`).join('')}</div>
<div class="summary"><b>🏢 কোম্পানির সর্বমোট তথ্য</b><div>🎯 <small>কোম্পানির টার্গেট</small><strong>${money(db.settings.target)}</strong></div><div>✅ <small>এ পর্যন্ত বিক্রি</small><strong>${money(total)}</strong></div></div>
<div class="actions"><button class="btn secondary" data-go="sales">＋ বিক্রি এন্ট্রি</button><button class="btn secondary" data-go="reports">রিপোর্ট</button><button class="btn danger" data-action="logout">লগআউট</button></div><p class="muted">ডেটা এই ডিভাইসের ব্রাউজারে সংরক্ষিত হচ্ছে। Cloud Sync চালু না করা পর্যন্ত অন্য ডিভাইসে দেখা যাবে না।</p>`)}
function roleBn(r){return {admin:'Admin',dealer:'Dealer',manager:'Manager',dsr:'DSR'}[r]||r}
function guardAdmin(){if(user.role!=='admin'){alert('অনুমতি নেই');go('home');return false}return true}
function accounts(){if(!guardAdmin())return;shell(`<h2>অ্যাকাউন্ট ব্যবস্থাপনা</h2><form data-form="user" class="panel"><div class="formgrid">${field('নাম','name')}${select('Role','role',['dealer','manager','dsr'])}${field('PIN (৪–১২ সংখ্যা)','pin','password','','minlength="4" maxlength="12"')}${field('এলাকা / পরিচিতি','area')}</div><button class="btn">অ্যাকাউন্ট তৈরি</button></form><h3>অ্যাকাউন্ট তালিকা (${db.users.length})</h3>${table(['নাম','Role','PIN','অবস্থা','কাজ'],db.users.map(x=>[esc(x.name),roleBn(x.role),x.id==='u-admin'?'••••••':esc(x.pin),x.active?'সক্রিয়':'বন্ধ',x.id==='u-admin'?'Admin':`<button class="btn small secondary" data-action="toggleUser" data-id="${x.id}">${x.active?'বন্ধ':'চালু'}</button> <button class="btn small danger" data-action="deleteUser" data-id="${x.id}">মুছুন</button>`]))}<p class="muted">নোট: PIN এখানে স্থানীয় Preview-এর জন্য। Production-এ PIN hash ও server-side authentication ব্যবহার করতে হবে।</p>`)}
function products(){shell(`<h2>প্রোডাক্ট ব্যবস্থাপনা</h2><form data-form="product" class="panel"><div class="formgrid">${field('পণ্যের নাম','name')}${field('কোড','code')}${select('একক','unit',db.settings.units)}${field('ক্রয় মূল্য','cost','number','0','min="0" step="0.01"')}${field('বিক্রয় মূল্য','price','number','0','min="0" step="0.01"')}</div><button class="btn">পণ্য সংরক্ষণ</button></form>${table(['পণ্য','কোড','একক','ক্রয়','বিক্রয়','কাজ'],db.products.map(p=>[esc(p.name),esc(p.code),esc(p.unit),money(p.cost),money(p.price),`<button class="btn small danger" data-action="delProduct" data-id="${p.id}">মুছুন</button>`]))}`)}
function dsrPage(){let list=db.users.filter(x=>x.role==='dsr'&&x.active);shell(`<h2>DSR ব্যবস্থাপনা</h2><div class="actions"><button class="btn" data-go="sales">＋ DSR বিক্রি এন্ট্রি</button><button class="btn secondary" data-go="accounts">DSR অ্যাকাউন্ট</button></div>${table(['DSR নাম','আজকের বিক্রি','মোট বকেয়া'],list.map(u=>[esc(u.name),money(db.sales.filter(s=>s.dsrId===u.id&&s.date===today()).reduce((a,x)=>a+x.total,0)),money(db.sales.filter(s=>s.dsrId===u.id).reduce((a,x)=>a+x.due,0))]))}<div class="notice">প্রতিটি DSR-এর বিক্রি এন্ট্রি তার নিজস্ব অ্যাকাউন্ট ID-র সঙ্গে যুক্ত হবে।</div>`)}
function salesPage(){let dsrs=db.users.filter(x=>x.role==='dsr'&&x.active),prods=db.products;shell(`<h2>বিক্রি / DSR Statement</h2><form data-form="sale" class="panel"><div class="formgrid">${select('DSR','dsrId',dsrs.map(x=>x.id+'|'+x.name),dsrs[0]?.id+'|'+dsrs[0]?.name)}${field('তারিখ','date','date',today())}${select('পণ্য','productId',prods.map(x=>x.id+'|'+x.name),prods[0]?.id+'|'+prods[0]?.name)}${field('পরিমাণ','qty','number','1','min="0.001" step="0.001"')}${field('ড্যামেজ পরিমাণ','damageQty','number','0','min="0" step="0.001"')}${field('নগদ জমা','paid','number','0','min="0" step="0.01"')}</div><button class="btn">বিক্রি সংরক্ষণ</button></form><div class="notice">বিক্রির মোট = বিক্রয় মূল্য × পরিমাণ। ড্যামেজ মূল্য আলাদা দেখানো হয়; ড্যামেজ বাদে বিক্রয় থেকে জমা বাদ দিলে বকেয়া। একই ড্যামেজ দ্বিতীয়বার বাদ হয় না।</div>${table(['তারিখ','DSR','পণ্য','পরিমাণ','মোট বিক্রি','ড্যামেজ মূল্য','নগদ','বকেয়া'],db.sales.slice().reverse().map(s=>[s.date,esc(db.users.find(u=>u.id===s.dsrId)?.name||'—'),esc(db.products.find(p=>p.id===s.productId)?.name||'—'),s.qty,money(s.total),money(s.damageValue),money(s.paid),money(s.due)]))}`)}
function receive(){let p=db.products;shell(`<h2>কোম্পানি থেকে মাল গ্রহণ</h2><form data-form="receive" class="panel"><div class="formgrid">${field('চালান নম্বর','challan')}${field('তারিখ','date','date',today())}${select('পণ্য','productId',p.map(x=>x.id+'|'+x.name),p[0]?.id+'|'+p[0]?.name)}${field('পরিমাণ','qty','number','1','min="0.001" step="0.001"')}${field('ক্রয় মূল্য / একক','cost','number','0','min="0" step="0.01"')}</div><button class="btn">মাল গ্রহণ নিশ্চিত</button></form>${table(['তারিখ','চালান','পণ্য','পরিমাণ','মূল্য'],db.stockMoves.filter(x=>x.source==='company').map(x=>[x.date,esc(x.challan),esc(db.products.find(p=>p.id===x.productId)?.name||'—'),x.qty,money(x.cost*x.qty)]))}`)}
function stockPage(){let rows=db.products.map(p=>{let q=db.stockMoves.filter(m=>m.productId===p.id).reduce((a,m)=>a+m.qty*m.sign,0);return [esc(p.name),esc(p.unit),q.toLocaleString('bn-BD'),money(q*p.cost)]});shell(`<h2>স্টক</h2><div class="statgrid"><div class="stat"><small>মোট পণ্য</small><b>${db.products.length}</b></div><div class="stat"><small>স্টক মুভমেন্ট</small><b>${db.stockMoves.length}</b></div></div>${table(['পণ্য','একক','বর্তমান পরিমাণ','আনুমানিক মূল্য'],rows)}<p class="muted">কোম্পানি গ্রহণ এবং বিক্রির স্টক মুভমেন্ট আলাদা রেকর্ডে সংরক্ষিত হয়। DSR/Dealer আলাদা stock allocation পরবর্তী ধাপে সংযুক্ত করতে হবে।</p>`)}
function expensesPage(){shell(`<h2>খরচ</h2><form data-form="expense" class="panel"><div class="formgrid">${field('খরচের খাত','category')}${field('তারিখ','date','date',today())}${field('পরিমাণ','amount','number','0','min="0" step="0.01"')}${field('বিবরণ','note')}</div><button class="btn">খরচ সংরক্ষণ</button></form>${table(['তারিখ','খাত','বিবরণ','পরিমাণ'],db.expenses.map(x=>[x.date,esc(x.category),esc(x.note),money(x.amount)]))}`)}
function reports(){let sales=db.sales.reduce((a,x)=>a+x.total,0),damage=db.sales.reduce((a,x)=>a+x.damageValue,0),net=sales-damage,paid=db.sales.reduce((a,x)=>a+x.paid,0),due=db.sales.reduce((a,x)=>a+x.due,0),expense=db.expenses.reduce((a,x)=>a+x.amount,0);shell(`<h2>রিপোর্ট ও হিসাব</h2><div class="statgrid">${[['সর্বমোট বিক্রি',sales],['ড্যামেজ মূল্য',damage],['ড্যামেজ বাদে বিক্রি',net],['নগদ জমা',paid],['আজকের/মোট বকেয়া',due],['মোট খরচ',expense],['নথিভুক্ত লাভ (প্রাথমিক)',db.sales.reduce((a,x)=>a+x.profit,0)-expense]].map(([k,v])=>`<div class="stat"><small>${k}</small><b>${money(v)}</b></div>`).join('')}</div><div class="actions"><button class="btn" data-action="export">JSON Backup ডাউনলোড</button><button class="btn secondary" data-action="csv">CSV রিপোর্ট</button><label class="btn secondary">Backup Restore<input id="restore" type="file" accept=".json,application/json" hidden></label></div><p class="muted">এই রিপোর্টে এই ব্রাউজারে থাকা এন্ট্রিগুলো ব্যবহার করা হয়েছে। পূর্ণ ঐতিহাসিক রিপোর্টের জন্য ডেটা এন্ট্রি সম্পূর্ণ এবং Backend Sync প্রয়োজন।</p>`);$('#restore').onchange=restore}
function settings(){if(!guardAdmin())return;shell(`<h2>Admin Settings & Control Center</h2>
<div class="notice">এই পেজটি শুধু Admin দেখতে ও পরিবর্তন করতে পারবেন। API তথ্য এখানে Save করলে অ্যাপের Configuration-এ সংরক্ষিত হবে। তবে Static Frontend নিজে থেকে নতুন Backend/কোড তৈরি করতে পারে না। গোপন API Key LocalStorage-এ রাখা নিরাপদ নয়; Production-এ Worker-এর server-side secret storage ব্যবহার করতে হবে। Supabase-এর anon/public key ছাড়া service_role বা private key এখানে দেবেন না।</div>
<form data-form="settings" class="panel">
<h3>১. অ্যাপ পরিচিতি ও ডিজাইন</h3><div class="formgrid">${field('ওয়েবসাইট / অ্যাপ নাম','appName','text',db.settings.appName)}${field('স্লোগান','tagline','text',db.settings.tagline)}${field('প্রতিষ্ঠানের নাম','company','text',db.settings.company)}${field('কোম্পানি টার্গেট','target','number',db.settings.target)}${field('ব্যবসা শুরুর তারিখ','businessStart','date',db.settings.businessStart)}${field('Primary Color','theme','text',db.settings.theme)}</div>
<h3>২. Admin PIN</h3>${field('Admin PIN পরিবর্তন','adminPin','password','','minlength="4" maxlength="12"')}
<h3>৩. Cloud Database — Supabase</h3><div class="formgrid">${field('Supabase Project URL','apiUrl','url',db.settings.apiUrl)}${field('Supabase anon / public key','apiKey','password',db.settings.apiKey)}</div><p class="muted">এখানে Supabase Project URL ও anon/public key দিন। service_role key কখনো Frontend-এ দেবেন না। Database Sync চালাতে SQL schema, Auth এবং RLS policy-ও সেটআপ থাকতে হবে।</p>
<h3>৪. Backend / Cloudflare Worker</h3>${field('Backend Worker API Base URL','workerApiUrl','url',db.settings.workerApiUrl)}<p class="muted">Scanner, AI Support, Secure API এবং Cloud Sync-এর নিরাপদ সার্ভার সংযোগের ঠিকানা। Worker deploy ও configure করার পর URL বসাবেন।</p>
<h3>৫. AI Challan Scanner / OCR API</h3><div class="formgrid">${select('Scanner Provider','scannerProvider',['gemini','openai-compatible','ocr-space','custom'],db.settings.scannerProvider||'gemini')}${field('Scanner Model','scannerModel','text',db.settings.scannerModel||'gemini-2.5-flash')}${field('Scanner API Endpoint URL','scannerApiUrl','url',db.settings.scannerApiUrl)}${field('Scanner API Key','scannerApiKey','password',db.settings.scannerApiKey)}</div><p class="muted">চালানের ছবি থেকে পণ্যের নাম, পরিমাণ, একক ও মূল্য শনাক্ত করার API কনফিগারেশন। API provider অনুযায়ী endpoint/model দিতে হবে। Private key সরাসরি Browser-এ ব্যবহার করবেন না; Worker proxy ব্যবহার করুন।</p>
<h3>৬. Smart AI Support API</h3><div class="formgrid">${select('AI Support Provider','supportProvider',['openai','gemini','openai-compatible','custom'],db.settings.supportProvider||'openai')}${field('AI Model','supportModel','text',db.settings.supportModel||'gpt-4o-mini')}${field('AI Support API Endpoint URL','supportApiUrl','url',db.settings.supportApiUrl)}${field('AI Support API Key','supportApiKey','password',db.settings.supportApiKey)}</div><p class="muted">AI Support-এর Provider, Model, Endpoint ও Key কনফিগারেশন। Database-এর প্রকৃত তথ্য Role Permission যাচাই করে Backend থেকে দিতে হবে; শুধু API Key বসালেই নিরাপদ Database access তৈরি হয় না।</p>
<h3>৭. Notification / Webhook API</h3>${field('Notification / Webhook Endpoint URL','notificationApiUrl','url',db.settings.notificationApiUrl)}
<h3>৮. পণ্যের একক</h3>${field('কমা দিয়ে একক লিখুন','units','text',db.settings.units.join(', '))}
<h3>৯. টালি খাতা কাস্টমাইজ</h3>${field('টালি খাতার নাম','taliName','text',db.talikhata.name)}<div class="field"><label>টালি খাতার নিয়ম</label><textarea name="taliRules">${esc(db.talikhata.rules)}</textarea></div>
<button class="btn">সব সেটিং ও API Configuration Save করুন</button></form>
<div class="panel"><h3>সংযোগ কনফিগারেশনের অবস্থা</h3><div class="statgrid"><div class="stat"><small>Supabase URL</small><b>${db.settings.apiUrl?'তথ্য দেওয়া আছে':'সেট করা হয়নি'}</b></div><div class="stat"><small>Backend Worker</small><b>${db.settings.workerApiUrl?'URL দেওয়া আছে':'সেট করা হয়নি'}</b></div><div class="stat"><small>Scanner API</small><b>${db.settings.scannerApiKey?'Key সংরক্ষিত':'Key দেওয়া হয়নি'}</b></div><div class="stat"><small>AI Support API</small><b>${db.settings.supportApiKey?'Key সংরক্ষিত':'Key দেওয়া হয়নি'}</b></div></div><p class="muted">এই Status শুধু Configuration সংরক্ষিত কি না দেখায়; API Live Connection সফল হয়েছে—এমন নিশ্চয়তা নয়।</p></div>
<div class="panel"><h3>ডেটা রক্ষণাবেক্ষণ</h3><div class="actions"><button class="btn secondary" data-action="export">Backup ডাউনলোড</button><button class="btn danger" data-action="logout">লগআউট</button></div><p class="muted">কোনো Reset বা Delete All বোতাম নেই। Backup ছাড়া ডেটা মুছবেন না।</p></div>`)}
function support(){shell(`<h2>সাপোর্ট</h2><form data-form="ticket" class="panel">${field('বিষয়','subject') }<div class="field"><label>সমস্যার বিবরণ</label><textarea name="message" required></textarea></div><button class="btn">টিকিট জমা দিন</button></form>${table(['তারিখ','ব্যবহারকারী','বিষয়','অবস্থা','উত্তর'],db.tickets.map(t=>[t.date,esc(t.user),esc(t.subject),esc(t.status),esc(t.reply||'অপেক্ষমাণ')]))}<div class="notice">AI Support সংযুক্ত নয়। এই সংস্করণে সাপোর্ট টিকিট লোকালভাবে সংরক্ষণ হয়; AI API/Backend সংযোগের জন্য সার্ভার-সাইড ফাংশন প্রয়োজন।</div>`)}
function talikhata(){shell(`<h2>${esc(db.talikhata.name)}</h2><p>${esc(db.talikhata.rules)}</p><div class="notice">টালি খাতার লেনদেন আলাদা হিসাবের রেকর্ড হিসেবে পরবর্তী Backend Migration-এ যুক্ত হবে।</div><button class="btn" data-go="sales">বিক্রির খাতা দেখুন</button>`)}
function notifications(){shell(`<h2>নোটিফিকেশন</h2><p class="muted">বর্তমানে কোনো নতুন নোটিফিকেশন নেই।</p>`)}
function generic(k){if(k==='all'){page='home';render();return}shell(`<h2>${esc(k)}</h2><p class="muted">এই মডিউলটি পূর্ণাঙ্গ Backend-এ সংযুক্ত করার জন্য প্রস্তুতিমূলক জায়গা।</p><button class="btn secondary" data-go="home">হোমে ফিরুন</button>`)}
function table(head,rows){if(!rows.length)return `<p class="muted">এখনো কোনো তথ্য নেই।</p>`;return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function forms(kind,f){let v=Object.fromEntries(f.entries());if(kind==='login'){let u=db.users.find(x=>x.pin===v.pin&&x.active);if(!u){alert('PIN সঠিক নয় অথবা অ্যাকাউন্ট বন্ধ।');return}user=u;sessionStorage.setItem(SESSION,u.id);log('LOGIN','লগইন');page='home';render();return}
if(kind==='user'){if(!guardAdmin())return;if(db.users.some(x=>x.pin===v.pin)){alert('এই PIN আগে ব্যবহার হয়েছে');return}db.users.push({id:crypto.randomUUID(),name:v.name,role:v.role,pin:v.pin,area:v.area,active:true});log('USER_CREATE',v.name);save();accounts()}
if(kind==='product'){db.products.push({id:crypto.randomUUID(),...v,cost:+v.cost,price:+v.price});log('PRODUCT_CREATE',v.name);save();products()}
if(kind==='sale'){let [dsrId]=v.dsrId.split('|'),[productId]=v.productId.split('|'),p=db.products.find(x=>x.id===productId);if(!p){alert('আগে প্রোডাক্ট তৈরি করুন');return}let qty=+v.qty,damageQty=+v.damageQty, total=qty*p.price,damageValue=damageQty*p.price,net=total-damageValue,paid=+v.paid;if(damageQty>qty||paid>net){alert('পরিমাণ বা জমার হিসাব যাচাই করুন');return}let due=net-paid;db.sales.push({id:crypto.randomUUID(),dsrId,productId,date:v.date,qty,damageQty,total,damageValue,net,paid,due,profit:qty*(p.price-p.cost)-damageQty*p.cost});db.stockMoves.push({id:crypto.randomUUID(),productId,qty,sign:-1,source:'sale',date:v.date,cost:p.cost});db.receipts.push({id:crypto.randomUUID(),amount:paid,date:v.date,dsrId});log('SALE_CREATE',`${p.name} ${qty}`);save();salesPage()}
if(kind==='receive'){let [productId]=v.productId.split('|');db.stockMoves.push({id:crypto.randomUUID(),productId,qty:+v.qty,sign:1,source:'company',date:v.date,cost:+v.cost,challan:v.challan});log('STOCK_RECEIVE',v.challan);save();receive()}
if(kind==='expense'){db.expenses.push({id:crypto.randomUUID(),...v,amount:+v.amount});log('EXPENSE_CREATE',v.category);save();expensesPage()}
if(kind==='settings'){if(!guardAdmin())return;for(const k of ['appName','tagline','company','businessStart','theme','apiUrl','apiKey','workerApiUrl','scannerProvider','scannerApiUrl','scannerApiKey','scannerModel','supportProvider','supportApiUrl','supportApiKey','supportModel','notificationApiUrl'])db.settings[k]=v[k]??'';db.settings.target=Number(v.target||0);db.settings.units=(v.units||'').split(',').map(x=>x.trim()).filter(Boolean);db.talikhata={name:v.taliName,rules:v.taliRules};if(v.adminPin){db.users.find(x=>x.id==='u-admin').pin=v.adminPin}log('SETTINGS_UPDATE','Admin Settings ও API Configuration');save();alert('সেটিং ও API Configuration সংরক্ষণ হয়েছে। Live API সংযোগ চালু করতে সংশ্লিষ্ট Backend Worker ও Provider সেটআপ সম্পন্ন থাকতে হবে।');settings()}
if(kind==='ticket'){db.tickets.unshift({id:crypto.randomUUID(),date:today(),user:user.name,subject:v.subject,message:v.message,status:'নতুন',reply:''});log('SUPPORT_TICKET',v.subject);save();support()}}
function actions(a,id){if(a==='logout'){user=null;sessionStorage.removeItem(SESSION);render()}if(a==='toggleUser'){let u=db.users.find(x=>x.id===id);u.active=!u.active;log('USER_STATUS',u.name);save();accounts()}if(a==='deleteUser'){if(!confirm('এই অ্যাকাউন্ট নিষ্ক্রিয় করে তালিকা থেকে মুছবেন?'))return;db.users=db.users.filter(x=>x.id!==id);log('USER_DELETE',id);save();accounts()}if(a==='delProduct'){if(!confirm('পণ্যটি মুছবেন? পুরোনো লেনদেন থাকবে।'))return;db.products=db.products.filter(x=>x.id!==id);log('PRODUCT_DELETE',id);save();products()}if(a==='export')download('shahin-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');if(a==='csv'){let csv='date,dsr,product,qty,total,damage,paid,due\\n'+db.sales.map(s=>[s.date,db.users.find(u=>u.id===s.dsrId)?.name,db.products.find(p=>p.id===s.productId)?.name,s.qty,s.total,s.damageValue,s.paid,s.due].map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\\n');download('shahin-sales-'+today()+'.csv',csv,'text/csv')}}
function download(name,data,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function restore(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.users||!x.settings)throw Error();if(!confirm('বর্তমান ডেটার উপর Backup Restore হবে। আগে বর্তমান Backup নিন। চালাবেন?'))return;db=x;save();alert('Backup Restore সম্পন্ন');render()}catch(err){alert('Backup ফাইল সঠিক নয়')}};r.readAsText(file)}
let sid=sessionStorage.getItem(SESSION);if(sid)user=db.users.find(x=>x.id===sid&&x.active)||null;render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
